@if (caricamento) {
  <p>Caricamento eroe...</p>
} @else if (errore) {
  <p>{{ errore }}</p>
} @else if (eroeSelezionato) {
  <h1>EROE SELEZIONATO</h1>
  <p>{{ eroeSelezionato.nome | uppercase }}</p>
  <p>{{ eroeSelezionato.superpotere | lowercase }}</p>
  <p>{{ eroeSelezionato.eroe }}</p>
  <p>{{ eroeSelezionato.id }}</p>

  <form>
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" [(ngModel)]="eroeSelezionato.nome" />
    <label for="superpotere">Superpotere</label>
    <input type="text" id="superpotere" name="superpotere" [(ngModel)]="eroeSelezionato.superpotere" />
    <label for="eroeSelezionato">Eroe</label>
    <input type="checkbox" id="eroe" name="eroe" [(ngModel)]="eroeSelezionato.eroe" />
    <label for="id">Id</label>
    <input type="number" id="id" name="id" [(ngModel)]="eroeSelezionato.id" />
  </form>
}
