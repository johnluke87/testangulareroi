<h1>I MIEI EROI</h1>
@if (caricamento) {
  <p class="loader">Caricamento eroi...</p>
} @else if (errore) {
  <p class="errore">{{ errore }}</p>
} @else {
<ul>
    <li *ngFor="let eroe of eroi" [class.selezionato]="eroeSelezionato === eroe"
        [routerLink]="'/dettaglio-' + eroe.id" (click)="onSelect(eroe)">
        {{eroe.nome | uppercase}} - {{eroe.superpotere | lowercase}} - {{eroe.eroe}} -
        {{eroe.id}}
    </li>
</ul>
}
