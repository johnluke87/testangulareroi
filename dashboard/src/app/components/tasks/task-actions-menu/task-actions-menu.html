<!-- [matMenuTriggerFor]: al clic apre il menu che ha la "template reference variable" #menu -->
<button mat-icon-button type="button" [matMenuTriggerFor]="menu" aria-label="Azioni del task">
  <mat-icon>more_vert</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item type="button" (click)="edit()">
    <mat-icon>edit</mat-icon>
    <span>Modifica</span>
  </button>

  <!-- rimandare ha senso solo per i task da fare -->
  @if (task().completedAt === null) {
    <!-- una voce che apre un altro menu = sottomenu -->
    <button mat-menu-item type="button" [matMenuTriggerFor]="snoozeMenu">
      <mat-icon>schedule</mat-icon>
      <span>Rimanda</span>
    </button>
  }

  <button mat-menu-item type="button" (click)="remove()">
    <mat-icon>delete</mat-icon>
    <span>Elimina</span>
  </button>
</mat-menu>

<mat-menu #snoozeMenu="matMenu">
  @for (option of snoozeOptions(); track option.label) {
    <button mat-menu-item type="button" (click)="snooze(option)">
      <span>{{ option.label }}</span>
      <small class="hint">{{ option.hint }}</small>
    </button>
  }
</mat-menu>
