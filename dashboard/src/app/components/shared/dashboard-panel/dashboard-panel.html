<mat-card class="panel" appearance="outlined">
    <mat-card-header>
        <mat-icon mat-card-avatar>{{icon()}}</mat-icon>
        <mat-card-title>{{title()}}</mat-card-title>
        <mat-card-subtitle>{{subtitle()}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div class="contenuto">
            <ng-content />

        </div>
    </mat-card-content>
</mat-card>
